<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" width="490" height="200">
  <rect width="100%" height="100%" fill="#000" />
  <style>
    @keyframes wipeIn {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0% 0 0); }
    }
    @keyframes rockY {
      0% { transform: skewY(0deg); }
      25% { transform: skewY(1.5deg); }
      50% { transform: skewY(0deg); }
      75% { transform: skewY(-1.5deg); }
      100% { transform: skewY(0deg); }
    }
    .wm {
      animation: wipeIn 1s ease 0.4s forwards,
                 rockY 4s ease-in-out 1.4s infinite;
      clip-path: inset(0 100% 0 0);
      transform-origin: center center;
    }
  </style>
  <g class="wm" font-family="'Courier New', monospace" font-size="7.5px">
    <g fill="#555555">
      <text x="17" y="38">PPPP    RRRR       A     N   N    A    V     V</text>
      <text x="17" y="52">P   P   R   R     A A    NN  N   A A    V   V</text>
      <text x="17" y="66">P   P   R   R    A   A   N N N  A   A    V V</text>
      <text x="17" y="80">PPPP    RRRR    AAAAAAA  N  NN AAAAAAA   V V</text>
      <text x="17" y="94">P       R  R   A     A  N   N A     A    V</text>
      <text x="17" y="108">P       R   R  A     A  N   N A     A    V</text>
    </g>
    <g fill="#d0d0d0">
      <text x="14" y="35">PPPP    RRRR       A     N   N    A    V     V</text>
      <text x="14" y="49">P   P   R   R     A A    NN  N   A A    V   V</text>
      <text x="14" y="63">P   P   R   R    A   A   N N N  A   A    V V</text>
      <text x="14" y="77">PPPP    RRRR    AAAAAAA  N  NN AAAAAAA   V V</text>
      <text x="14" y="91">P       R  R   A     A  N   N A     A    V</text>
      <text x="14" y="105">P       R   R  A     A  N   N A     A    V</text>
    </g>
  </g>
</svg>