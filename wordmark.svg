<svg width="100%" viewBox="0 0 690 235" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns="http://www.w3.org/2000/svg">
  <title>PRANAV ASCII wordmark</title>
  <desc>Animated terminal window revealing the name PRANAV rendered as 3D isometric block ASCII art</desc>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="wipe">
      <rect x="46.0" y="30" height="193" width="0">
        <animate attributeName="width" from="0" to="600" dur="1.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Terminal window background -->
  <rect width="680" height="225" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="679" height="224" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar line -->
  <line x1="0" y1="28" x2="680" y2="28" stroke="#30363d"/>

  <!-- Traffic light dots -->
  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>

  <!-- Terminal title -->
  <text x="340" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">pranav@terminal: ~$ ./wordmark.sh --3d</text>

  <!-- 3D isometric PRANAV text with wipe animation -->
  <g clip-path="url(#wipe)" fill="#c9d1d9">
    <text xml:space="preserve" x="46.0" y="60.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing">      ___           ___           ___           ___           ___           ___     </text>
    <text xml:space="preserve" x="46.0" y="74.5" font-size="12.5" textLength="588.0" lengthAdjust="spacing">     /\  \         /\  \         /\  \         /\__\         /\  \         /\__\    </text>
    <text xml:space="preserve" x="46.0" y="89.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing">    /::\  \       /::\  \       /::\  \       /::|  |       /::\  \       /:/  /    </text>
    <text xml:space="preserve" x="46.0" y="103.5" font-size="12.5" textLength="588.0" lengthAdjust="spacing">   /:/\:\  \     /:/\:\  \     /:/\:\  \     /:|:|  |      /:/\:\  \     /:/  /     </text>
    <text xml:space="preserve" x="46.0" y="118.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing">  /::\~\:\  \   /::\~\:\  \   /::\~\:\  \   /:/|:|  |__   /::\~\:\  \   /:/__/  ___ </text>
    <text xml:space="preserve" x="46.0" y="132.5" font-size="12.5" textLength="588.0" lengthAdjust="spacing"> /:/\:\ \:\__\ /:/\:\ \:\__\ /:/\:\ \:\__\ /:/ |:| /\__\ /:/\:\ \:\__\  |:|  | /\__\</text>
    <text xml:space="preserve" x="46.0" y="147.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing"> \/__\:\/:/  / \/_|::\/:/  / \/__\:\/:/  / \/__|:|/:/  / \/__\:\/:/  /  |:|  |/:/  /</text>
    <text xml:space="preserve" x="46.0" y="161.5" font-size="12.5" textLength="588.0" lengthAdjust="spacing">      \::/  /     |:|::/  /       \::/  /      |:/:/  /       \::/  /   |:|__/:/  / </text>
    <text xml:space="preserve" x="46.0" y="176.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing">       \/__/      |:|\/__/        /:/  /       |::/  /        /:/  /     \::::/__/  </text>
    <text xml:space="preserve" x="46.0" y="190.5" font-size="12.5" textLength="588.0" lengthAdjust="spacing">                  |:|  |         /:/  /        /:/  /        /:/  /       ~~~~      </text>
    <text xml:space="preserve" x="46.0" y="205.0" font-size="12.5" textLength="588.0" lengthAdjust="spacing">                   \|__|         \/__/         \/__/         \/__/                  </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="636.0" y="194.0" width="7" height="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.86;1" dur="2.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="1s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>