<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" width="600" height="50">
  <style>
    @keyframes fade1 {
      0%, 30% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes fade2 {
      0%, 33% { opacity: 0; }
      36%, 63% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes fade3 {
      0%, 66% { opacity: 0; }
      69%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .t1 { animation: fade1 9s infinite; }
    .t2 { animation: fade2 9s infinite; }
    .t3 { animation: fade3 9s infinite; }
    .cursor { animation: blink 1s step-end infinite; }
  </style>
  <text x="300" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" class="t1" fill="#58a6ff">Building AI Integrated Products</text>
  <text x="300" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" class="t2" fill="#58a6ff">Full Stack Developer &amp; Creator</text>
  <text x="300" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" class="t3" fill="#58a6ff">Turning Ideas Into Code</text>
  <rect x="490" y="16" width="2" height="20" fill="#58a6ff" class="cursor"/>
</svg>
